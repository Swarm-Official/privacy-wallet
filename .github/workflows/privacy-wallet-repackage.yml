name: Privacy wallet Windows package correction

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: zingolabs/zingolib
          ref: 7a542ce4a6b14d83bd0108ff3e6c5d8d4c8c71a8
          path: vendor/zingolib
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked packaging dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
      - name: Restore verified compiled app inputs
        run: python scripts/restore-privacy-compiled.py
      - name: Check main process and packaging configuration
        run: |
          node --check public/electron.js
          node scripts/check-privacy-package-config.js
          node scripts/check-win-arch.js --arch x64
      - name: Package corrected main process with unchanged compiled modules
        run: |
          Copy-Item public/electron.js build/electron.js
          yarn electron-builder --win zip --x64 --config configs/privacy-testnet-builder.cjs --publish never
      - name: Record exact source and inherited compilation
        run: |
          git rev-parse HEAD | Set-Content dist/source-commit.txt
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-List | Out-File dist/SHA256SUMS.txt
          Copy-Item native/Cargo.lock dist/Cargo.lock
          Copy-Item patches/privacy-sdk-v2.json dist/sdk-integration.json
          Copy-Item compiled-provenance.json dist/compiled-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-wallet-windows-x64-unsigned-testnet
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/source-commit.txt
            dist/Cargo.lock
            dist/sdk-integration.json
            dist/compiled-provenance.json
          retention-days: 14
